name: Deploy Flutter Web (dev)

on:
  push:
    branches:
      - develop
    # Only what goes into the build, the generated pages or the Firestore indexes is worth publishing.
    # Manual deploys (workflow_dispatch) ignore this filter.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - '.vscode/**'
      - 'tool/web_icons/**'
      - 'tool/seed_dev/**'
      - '.github/workflows/ci.yml'
      - 'analysis_options.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # Before the site, so the new search never ships without its indexes. It only creates and updates:
    # without --force, indexes that exist only in the project are not deleted.
    - name: Publicar índices do Firestore
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
          npx --yes firebase-tools@15.34.2 deploy --only firestore:indexes \
          --project observatorio-geo-hist-dev --non-interactive

    - name: Ler versão do Flutter do .fvmrc
      id: fvm
      run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ steps.fvm.outputs.version }}
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build Flutter Web app
      run: flutter build web --release --dart-define=APP_ENV=dev

    - name: Bloquear indexação do ambiente de dev
      run: |
        printf 'User-agent: *\nDisallow: /\n' > build/web/robots.txt

    # The generator copies build/web/index.html into every page, so the tag has to go before it
    # runs or dev would count visits.
    - name: Remover o Analytics do dev
      run: |
        perl -0pi -e 's{<!-- Google tag \(gtag\.js\) -->.*?</script>\s*<script>.*?</script>}{}s' build/web/index.html
        ! grep -q 'googletagmanager' build/web/index.html || { echo "O snippet do gtag continua no index.html."; exit 1; }

    - name: Gerar páginas
      run: flutter test tool/seo/generate_seo.dart --dart-define=APP_ENV=dev

    - name: Conferir as páginas geradas (dev)
      run: |
        achados=$(grep -rl 'googletagmanager' build/web || true)
        test -z "$achados" || { echo "Páginas com Analytics no dev:"; echo "$achados"; exit 1; }
        ! test -e build/web/sitemap.xml || { echo "O dev não pode ter sitemap.xml."; exit 1; }
        sem_noindex=$(find build/web -name '*.html' -print0 | xargs -0 grep -L 'noindex, nofollow' || true)
        test -z "$sem_noindex" || { echo "Páginas sem noindex no dev:"; echo "$sem_noindex"; exit 1; }

    # The dev .htaccess is the versioned one plus the password and X-Robots-Tag. Without the
    # variable the deploy fails instead of publishing dev open.
    - name: Proteger o dev com senha
      env:
        HTPASSWD_PATH: ${{ vars.HTPASSWD_PATH }}
      run: |
        test -n "$HTPASSWD_PATH" || { echo "Variável HTPASSWD_PATH vazia: o dev ficaria sem senha."; exit 1; }
        ! grep -q 'Require all granted' build/web/.htaccess || { echo "Require all granted libera arquivos sem senha."; exit 1; }
        printf '\n<IfModule mod_headers.c>\n  Header always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> build/web/.htaccess
        printf '\nAuthType Basic\nAuthName "Obs Geo Hist | Ambiente de Testes"\nAuthUserFile "%s"\nRequire valid-user\n' "$HTPASSWD_PATH" >> build/web/.htaccess
        grep -q '^Require valid-user$' build/web/.htaccess

    - name: Sync build/web to HostGator (dev)
      uses: SamKirkland/FTP-Deploy-Action@d0aa83872616587eb552bc831bb9166b3f9c5ad5 # 4.3.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        security: loose
        server-dir: ./
        local-dir: build/web/

    # Dev has no Storage. The service account needs the Firebase Rules Admin role.
    - name: Publicar regras do Firestore
      run: |
        GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
          npx --yes firebase-tools@15.34.2 deploy --only firestore:rules \
          --project observatorio-geo-hist-dev --non-interactive
