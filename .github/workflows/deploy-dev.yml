name: Deploy Flutter Web (dev)

on:
  push:
    branches:
      - develop
    # Only what goes into the build or the Firestore indexes is worth publishing.
    # Manual deploys (workflow_dispatch) ignore this filter.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - '.vscode/**'
      - 'tool/**'
      - '.github/workflows/ci.yml'
      - 'analysis_options.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # Before the site, so the new search never ships without its indexes. It only creates and updates:
    # without --force, indexes that exist only in the project are not deleted.
    - name: Publicar índices do Firestore
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
          npx --yes firebase-tools@15.34.2 deploy --only firestore:indexes \
          --project observatorio-geo-hist-dev --non-interactive

    - name: Ler versão do Flutter do .fvmrc
      id: fvm
      run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ steps.fvm.outputs.version }}
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build Flutter Web app
      run: flutter build web --release --dart-define=APP_ENV=dev

    - name: Bloquear indexação do ambiente de dev
      run: |
        printf 'User-agent: *\nDisallow: /\n' > build/web/robots.txt

    # The .htaccess is not uploaded: it lives only on the server, with the password that cPanel
    # adds to it, and the deploy only deletes files it uploaded itself.
    - name: Sync build/web to HostGator (dev)
      uses: SamKirkland/FTP-Deploy-Action@d0aa83872616587eb552bc831bb9166b3f9c5ad5 # 4.3.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        security: loose
        server-dir: ./
        local-dir: build/web/

    # Dev has no Storage. The service account needs the Firebase Rules Admin role.
    - name: Publicar regras do Firestore
      run: |
        GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
          npx --yes firebase-tools@15.34.2 deploy --only firestore:rules \
          --project observatorio-geo-hist-dev --non-interactive
