name: Deploy Flutter Web (produção)

on:
  push:
    branches:
      - main
    # Only what goes into the build or the Firestore indexes is worth publishing.
    # Manual deploys (workflow_dispatch) ignore this filter.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - '.vscode/**'
      - 'tool/**'
      - '.github/workflows/ci.yml'
      - 'analysis_options.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Before the site, so the new search never ships without its indexes. It only creates and updates:
    # without --force, indexes that exist only in the project are not deleted.
    - name: Publicar índices do Firestore
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
          npx --yes firebase-tools@15 deploy --only firestore:indexes \
          --project observatorio-geo-hist --non-interactive

    - name: Ler versão do Flutter do .fvmrc
      id: fvm
      run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.fvm.outputs.version }}
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build Flutter Web app
      run: flutter build web --release --dart-define=APP_ENV=prod

    - name: Sync build/web to HostGator (produção)
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        security: loose
        server-dir: ./
        local-dir: build/web/
