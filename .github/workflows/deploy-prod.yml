name: Deploy Flutter Web (produção)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Ler versão do Flutter do .fvmrc
      id: fvm
      run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.fvm.outputs.version }}
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build Flutter Web app
      run: flutter build web --release --dart-define=APP_ENV=prod

    - name: Sync build/web to HostGator (produção)
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        security: loose
        server-dir: ./
        local-dir: build/web/
