name: Deploy do site (produção)

on:
  push:
    branches:
      - main
    # Only what goes into the build, the generated pages or the Firestore indexes is worth publishing.
    # Manual deploys (workflow_dispatch) ignore this filter.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - '.vscode/**'
      - 'tool/web_icons/**'
      - 'tool/seed_dev/**'
      - '.github/workflows/ci.yml'
      - 'analysis_options.yaml'
  workflow_dispatch:
  # Enable after the first production deploy with the generator. Firestore content changes without
  # a commit, so the pages and the sitemap have to be regenerated now and then. Also uncomment the
  # keepalive job at the end of the file.
  # schedule:
  #   - cron: '0 6 */3 * *'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
    - name: Baixar o código
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # Before the site, so the new search never ships without its indexes. It only creates and updates:
    # without --force, indexes that exist only in the project are not deleted.
    - name: Publicar índices do Firestore
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
          npx --yes firebase-tools@15.34.2 deploy --only firestore:indexes \
          --project observatorio-geo-hist --non-interactive

    - name: Ler versão do Flutter do .fvmrc
      id: fvm
      run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

    - name: Configurar o Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ steps.fvm.outputs.version }}
        cache: true

    - name: Instalar dependências
      run: flutter pub get

    - name: Compilar o app Flutter Web
      run: flutter build web --release --dart-define=APP_ENV=prod

    - name: Gerar páginas
      run: flutter test tool/seo/generate_seo.dart --dart-define=APP_ENV=prod

    - name: Conferir as páginas geradas (produção)
      run: |
        test -s build/web/sitemap.xml || { echo "sitemap.xml ausente ou vazio."; exit 1; }
        com_noindex=$(grep -rl 'noindex' --include='*.html' build/web || true)
        test -z "$com_noindex" || { echo "Páginas com noindex em produção:"; echo "$com_noindex"; exit 1; }

    # The versioned .htaccess replaces the server's copy: it must exist in the build and not carry
    # the dev password or cPanel blocks.
    - name: Conferir o .htaccess
      run: |
        test -f build/web/.htaccess || { echo ".htaccess ausente no build."; exit 1; }
        ! grep -qE 'AuthType|AuthUserFile|AddHandler|Require all granted' build/web/.htaccess \
          || { echo ".htaccess com senha do dev ou bloco do cPanel."; exit 1; }

    - name: Enviar build/web para a HostGator (produção)
      uses: SamKirkland/FTP-Deploy-Action@d0aa83872616587eb552bc831bb9166b3f9c5ad5 # 4.3.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        security: loose
        server-dir: ./
        local-dir: build/web/

    # After the site: the rules deny the post query of the previous build, which doesn't filter on
    # isPublished. The service account needs the Firebase Rules Admin role.
    - name: Publicar regras do Firestore e do Storage
      run: |
        GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
          npx --yes firebase-tools@15.34.2 deploy --only firestore:rules,storage \
          --project observatorio-geo-hist --non-interactive

  # Enable together with `schedule`. GitHub disables scheduled workflows after 60 days without
  # repository activity; this job turns the workflow back on. actions: write only here.
  # keepalive:
  #   if: github.event_name == 'schedule'
  #   runs-on: ubuntu-latest
  #   permissions:
  #     actions: write
  #   steps:
  #   - name: Reativar o workflow agendado
  #     env:
  #       GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #     run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-prod.yml/enable"
