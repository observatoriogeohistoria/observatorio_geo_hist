name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - '.vscode/**'
      - 'tool/**'
      - '.github/workflows/deploy-*.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Ler versão do Flutter do .fvmrc
      id: fvm
      run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.fvm.outputs.version }}
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Conferir formatação
      run: |
        find lib -name '*.dart' ! -name '*.g.dart' ! -name '*.freezed.dart' -print0 \
          | xargs -0 dart format --output=none --set-exit-if-changed

    - name: Analyze
      run: flutter analyze --no-fatal-infos

    - name: Build Flutter Web app
      run: flutter build web --release
